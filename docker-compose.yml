services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - '${HTTP_HOST_PORT:-80}:80'
      - '${HTTPS_HOST_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    image: ${API_IMAGE:-handshake-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: ${MONGO_URI}
      CLIENT_URL: ${CLIENT_URL}
      CHAIN_ID: ${CHAIN_ID:-43113}
      PINATA_JWT: ${PINATA_JWT}
      PINATA_GATEWAY: ${PINATA_GATEWAY}
      AVALANCHE_FUJI_RPC: ${AVALANCHE_FUJI_RPC:-https://api.avax-test.network/ext/bc/C/rpc}
      AVALANCHE_FUJI_WS: ${AVALANCHE_FUJI_WS:-}
      MODEL_REGISTRY_ADDRESS: ${MODEL_REGISTRY_ADDRESS:-}
      MODEL_REGISTRY_DEPLOY_BLOCK: ${MODEL_REGISTRY_DEPLOY_BLOCK:-}
    expose:
      - '4000'
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-handshake-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - '3000'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
